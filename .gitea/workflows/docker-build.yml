name: Docker build

on:
  push:
    branches: [master, main]
  pull_request:

# Push in die Registry ist optional und erst aktiv, sobald die Repo-Variable
# GITEA_REGISTRY (z.B. "gitea.example.com") und das Secret REGISTRY_TOKEN
# (Access-Token mit "write:package") gesetzt sind. Ohne die beiden wird nur
# gebaut, nicht gepusht -> Workflow läuft also auch direkt nach der Migration,
# bevor die Registry konfiguriert ist.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in zur Gitea-Registry
        if: gitea.event_name != 'pull_request' && vars.GITEA_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GITEA_REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Metadaten (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.GITEA_REGISTRY || 'local' }}/${{ gitea.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build (und Push, wenn Registry konfiguriert ist)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ gitea.event_name != 'pull_request' && vars.GITEA_REGISTRY != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
