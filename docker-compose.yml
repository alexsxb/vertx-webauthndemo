services:
  mongo:
    image: mongo:7
    container_name: webauthn-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Web-UI um sich die gespeicherten Authenticator-Dokumente anzuschauen
  mongo-express:
    image: mongo-express:1
    container_name: webauthn-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"

  # Production-artiger Stack in Containern. http://localhost:8082 ist ein
  # reiner HTTP-Smoketest; für Passkeys/KeePassXC https://localhost:9443
  # (über Caddy, siehe unten) nutzen. Zertifikate vorher einmalig erzeugen:
  # ./certs/generate.sh
  backend:
    build: ./backend
    container_name: webauthn-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      RP_ID: localhost
      # Auf diesem Branch (WebAuthn4JHandler) zählt für die eigentliche Passkey-
      # Verifikation nur der ERSTE Origin (siehe MainVerticle) - deshalb hier
      # https://localhost:9443 (Caddy/KeePassXC) zuerst, 8082 nur für CORS.
      FRONTEND_ORIGIN: https://localhost:9443,http://localhost:8082
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: webauthn-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"

  # TLS-Terminierung vor dem Frontend, damit Passwortmanager-Erweiterungen wie
  # KeePassXC-Browser (die nur auf https:// reagieren) auch gegen den
  # Compose-Stack funktionieren - nicht nur gegen den Vite-Dev-Server.
  caddy:
    image: caddy:2-alpine
    container_name: webauthn-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "9443:9443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro

volumes:
  mongo-data:
